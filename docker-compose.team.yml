services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spotify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1g

  cassandra:
    image: cassandra:5.0
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: SpotifyDemoCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    mem_limit: 2g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 256m

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1536m

  minio-init:
    image: alpine:3.22
    user: root
    command: sh -c "chown -R 65532:65532 /data"
    volumes:
      - minio_data:/data
    restart: "no"

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m
    depends_on:
      minio-init:
        condition: service_completed_successfully

  backend:
    image: oussamabenbouziane/wavelength-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MINIO_PUBLIC_ENDPOINT: "localhost:8080"
    mem_limit: 512m

  web:
    image: oussamabenbouziane/wavelength-web:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - minio

  history-consumer:
    image: oussamabenbouziane/wavelength-backend:latest
    restart: unless-stopped
    command: python -m app.workers.history_consumer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    stop_grace_period: 15s
    mem_limit: 256m

  billing-worker:
    image: oussamabenbouziane/wavelength-backend:latest
    restart: unless-stopped
    command: python -m app.workers.billing_worker
    env_file: .env
    environment:
      BILLING_INTERVAL_SECONDS: "300"
    profiles: ["billing"]
    mem_limit: 192m

volumes:
  postgres_data:
  cassandra_data:
  redis_data:
  kafka_data:
  minio_data:
