
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            default_type text/plain;
            return 200 "NGINX is running\n";
        }

        # Temporary landing endpoint
        location / {
            default_type text/plain;
            return 200 "Spotify Data Platform Gateway\n";
        }
    }
}
